# wf.yaml — 工程（WF）と成果物・担当。
#
# 正: ~/.skills/video-studio/contract/index.yaml の flow。
# 索引は issue（wf:<id> ラベル）、成果物はファイル。issue は持ち主の repo に置く。
# 台帳（canonical）は data/videos.jsonl。書き手は videoman、スキーマは data/SCHEMA.md。
# PM/オーケストレーターはこの 1 枚と issue/ファイルを読むだけ（domain は触らない）。
version: 1
updated: 2026-09-28

# 制作〜追尾の順。前段（channel/target/ip/voice/imagen）は設定で固定。
flow: [neta, script, tts, prompt, image, se, mux, deploy, metrics]

# issue の作成先（tracker）。--repo / env VIDEOMAN_TRACKER で上書き。
tracker: bonsai/kanalvideo-analysis

# 供給元（library）。パスは直書きせずここで参照し、config で差し替えられる。
library:
  script:
    path: ~/.skills/talkscripts
    repo: bonsai/talkscripts
    ledger: SERIES.md
    seed: seed/ # 査読前の種（INDEX.md を除く）
    review: pr # 査読中 = open PR
    done: '<series>/#NN-*.md' # 完成 = 系列フォルダ
    actions: [talkscript-write, talkscript-audit, hall-eval]

# 人間が触るのは 視聴（view）と ダメ出し（review）だけ。
# 企画・制作・投稿（neta〜mux, deploy）は agent が回す。人間は事後にダメ出しで差し戻す。
human:
  view: 'videoman serve（http://127.0.0.1:8787）で見る'
  review: 'ダメ出し（reviews.jsonl へ。必要なら issue を立てる）'
  sinks: ['reviews.jsonl', 'issue:bonsai/kanalvideo-analysis']
  outside: true # スマホから見てダメ出しできる

# 担当: who=human|agent / agent=エージェント名 / outside=出先（スマホ）でできるか
wfs:
  - id: neta
    name: ネタワード
    produces: '<slug>/neta.md'
    labels: [wf:neta]
    gate: ワードが N 語ある（人間の関所は通らない。出た案は review でダメ出し可）
    who: agent
    agent: lumiere
  - id: script
    name: 台本
    library: script
    produces: "台本 <series>/#NN-<slug>.md + サムネプロンプト（同時）"
    labels: [wf:script, series:<series>]
    gate: 600-700字（90秒）/ RUBRIC 9軸 / サムネプロンプトに aspect 指定
    states: [seed, review, done]
    who: agent
    agent: lumiere
    note: '台本を依頼するとき、同じ依頼でサムネプロンプトも出す（後から別依頼にしない）'
  - id: tts
    name: 読み上げ
    produces: 'talk.mp3'
    labels: [wf:tts]
    gate: mp3 が在る
    who: agent
    agent: lumiere
  - id: prompt
    name: 画像プロンプト
    produces: 'prompts.yaml'
    labels: [wf:prompt]
    gate: 枚数ぶん在る
    who: agent
    agent: lumiere
  - id: image
    name: 画像
    produces: "images/*.png + サムネ（aspect はタイプ）"
    labels: [wf:image]
    gate: 全枚数・文字を焼いていない・タイプの aspect
    who: agent
    agent: image-gen
  - id: se
    name: SE
    produces: 'se/*.wav'
    labels: [wf:se]
    gate: 素材を持たず合成する
    who: agent
    agent: se-synth
  - id: mux
    name: 結合動画
    produces: '*-final.mp4'
    labels: [wf:mux]
    gate: -final で終わる・尺
    who: agent
    agent: lumiere
  - id: deploy
    name: デプロイ
    produces: youtube_id / MEGA
    labels: [wf:deploy]
    gate: private→公開の手順（投稿も agent。人間は見てからダメ出しする）
    who: agent
    agent: lumiere
    engine: yt-upload
  - id: metrics
    name: 統計
    produces: 'stats.json'
    labels: [wf:metrics]
    gate: 数値が在る
    who: agent
    agent: metrics

# 成果物を探す場所（root 相対。{slug} 展開、glob 可）
# PM はここを見て「どの工程まで来ているか」を判定する。
roots:
  video-gen: ~/.skills/video-gen
  video-pipeline: ~/.skills/video-pipeline
  video-studio: ~/.skills/video-studio
  talkscripts: ~/.skills/talkscripts
  mega: /mnt/c/Users/dance/Documents/MEGA

artifacts:
  # 台本と同時にサムネプロンプトも出す（同じ依頼）
  neta:
    - 'data/programs/{slug}/kikaku.md'
    - 'projects/*{slug}*.md'
  script:
    - 'out/*/{slug}*script*.md'
    - 'data/programs/{slug}/script.md'
    - 'content/{slug}/speech*.md'
    - '*/*{slug}*.md'
    - '*/*{slug}*thumb*prompt*'
    - 'data/programs/{slug}/thumb-prompt*'
  tts:
    - 'out/*/{slug}*talk*.mp3'
    - 'data/audio/{slug}/*.mp3'
    - 'tts/*{slug}*.mp3'
    - 'out/{slug}/*talk*.mp3'
  prompt:
    - 'out/*/{slug}*prompt*.yaml'
    - 'data/programs/{slug}/prompts.yaml'
    - 'out/{slug}/*prompt*.yaml'
  image:
    - 'out/*/{slug}*image*.*'
    - 'data/{slug}/*.png'
    - 'out/{slug}/*image*.*'
    - 'out/{slug}/*thumb*.*'
    - 'data/{slug}/thumbnail.png'
  se:
    - 'out/*/{slug}*se*.wav'
    - 'out/{slug}/se/*.wav'
    - 'out/{slug}/*se*.wav'
  mux:
    - 'out/*/{slug}*-final.mp4'
    - 'data/{slug}/motion/*.mp4'
    - 'videos/*{slug}*.mp4'
    - 'out/{slug}/*-final.mp4'
    - '*{slug}__*.mp4'
  # deploy / metrics は canonical の youtube_id / stats を見る（ファイルではない）

# 工程 ↔ repo の対応（一覧。成果物がどの repo にあるか）
repos:
  neta:    [video-gen/themes, video-studio/projects]
  script:  ['talkscripts/<series>', video-gen/data/programs, video-pipeline/content]
  tts:     [video-gen/data/audio, video-pipeline/tts, video-studio/out]
  prompt:  [video-gen/themes, video-studio/out]
  image:   [video-gen/data, video-studio/out]
  se:      [video-studio/out, 4koma-video]
  mux:     [video-gen/data/motion, video-pipeline/videos, video-studio/out, MEGA]
  deploy:  [YouTube, MEGA]
  metrics: [YouTube, kanalvideo-analysis/data/db]

# gate（通過条件）の機械可読な定義。presence（在るか）だけでなく内容も見る。
#   kind: presence | count | words | chars | contains | duration | suffix | aspect | number | youtube | manual
#   from_type: true → casting.yaml の types.<kind> の aspect / chars / seconds を期待値に使う
#   manual は自動判定できない条件（「通った」扱いにしない。人間か agent が確かめる）
checks:
  - id: neta-body
    stage: neta
    kind: words
    match: "*.md"
    min: 20
    note: ネタワードが N 語ある
  - id: script-chars
    stage: script
    kind: chars
    match: "*.md"
    from_type: true
    note: タイプの尺に合う字数
  - id: script-thumb-aspect
    stage: script
    kind: contains
    match: "*thumb*"
    pattern: "aspect"
    note: サムネプロンプトに aspect 指定（台本と同時に出す）
  - id: script-rubric
    stage: script
    kind: manual
    note: RUBRIC 9軸で査読（talkscript-audit / hall-eval）
  - id: tts-duration
    stage: tts
    kind: duration
    match: "*.mp3"
    from_type: true
    tolerance: 0.7 # 収録は遅めに取って mux で詰める運用（30s 収録→atempo で 30s）。実尺の担保は mux-duration
    note: 収録の尺が想定内（詰めは mux で）
  - id: prompt-count
    stage: prompt
    kind: count
    match: "*.yaml"
    min: 1
    note: 枚数ぶん在る
  - id: image-count
    stage: image
    kind: count
    match: "*.{png,jpg,jpeg}"
    min: 1
    note: 全枚数
  - id: image-aspect
    stage: image
    kind: aspect
    match: "*.{png,jpg,jpeg}"
    from_type: true
    note: タイプの aspect
  - id: image-no-text
    stage: image
    kind: manual
    note: 文字を焼いていない
  - id: se-files
    stage: se
    kind: count
    match: "*.wav"
    min: 1
    note: SE が在る
  - id: se-synth
    stage: se
    kind: manual
    note: 素材を持たず合成する
  - id: mux-final
    stage: mux
    kind: suffix
    match: "*.mp4"
    pattern: "-final.mp4"
    note: "-final で終わる"
  - id: mux-duration
    stage: mux
    kind: duration
    match: "*.mp4"
    from_type: true
    note: 尺
  - id: mux-kind-duration
    stage: mux
    kind: kind_duration
    match: "*.mp4"
    max_short_seconds: 90
    note: 90秒以下のみ short（超えたら long 系へ）
  - id: mux-aspect
    stage: mux
    kind: aspect
    match: "*.mp4"
    from_type: true
    note: タイプの aspect（short = 9:16）
  - id: deploy-id
    stage: deploy
    kind: youtube
    note: youtube_id（private→公開の手順）
  - id: metrics-views
    stage: metrics
    kind: number
    note: 数値が在る
