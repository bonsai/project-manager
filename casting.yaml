# casting.yaml — 誰に・どのモデルで・どの鍵で頼むか（動画タイプ別のキャスト表）
#
# 書き方（テンプレ）:
#   defaults.<wf>:       全タイプ共通の既定
#   types.<type>.use:    そのタイプで使う工程（順は wf.yaml の flow）
#   types.<type>.cast:   既定の上書き（agent / model / token）
#
# 規則:
#   - token は **env 名だけ**書く。値は書かない（鍵は repo に置かない）。
#   - model は opencode の provider/model 形式（例 opencode-go/grok-4.5, sakura, deepseek/...）。
#   - agent は ~/.config/opencode/agents/<agent>.md の名前。
version: 1
updated: 2026-09-28

# ── 既定（全タイプ共通） ──────────────────────────────
defaults:
  pm:      { agent: pm,         model: opencode-go/kimi-k3, token: OPENCODE_API_KEY }
  script:  { agent: lumiere,    model: opencode-go/grok-4.5, token: OPENCODE_API_KEY }
  tts:     { agent: sakura-tts, model: sakura,              token: SAKURA_API_KEY }
  image:   { agent: image-gen,  model: cf-flux,             token: "" } # wrangler OAuth
  se:      { agent: se-synth,   model: local,               token: "" }
  mux:     { agent: lumiere,    model: local,               token: "" }
  metrics: { agent: metrics,    model: yt-dlp,              token: "" }
  stt:     { agent: stt,        model: deepgram,            token: DEEPGRAM_API_KEY }
  qc:      { agent: qc,         model: nvidia-nim,          token: NVIDIA_API_KEY }

# ── 動画タイプ別 ──────────────────────────────────────
types:
  essay: # 知恵の館・横 long（エッセイ朗読）
    use: [script, tts, mux, deploy, metrics]
    cast:
      script: { model: deepseek/deepseek-chat } # 長文は deepseek
  short: # 縦 Short（video-gen）
    use: [script, tts, image, mux, deploy, metrics]
    cast:
      script: { model: opencode-go/kimi-k3 }
  koma: # 哲学四コマ（4koma-video）
    use: [script, image, tts, se, mux, deploy, metrics]
  explainer: # repo 解説（research → article → speech → tts → video）
    use: [neta, script, tts, image, mux, deploy, metrics]
    cast:
      script: { agent: lumiere, model: opencode-go/grok-4.5 }

# ── 新タイプを足すとき（雛形） ────────────────────────
#   <type>:
#     use: [script, tts, mux, deploy, metrics]
#     cast:
#       <wf>: { agent: <name>, model: <provider/model>, token: <ENV> }
